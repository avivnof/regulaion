name: One-off bump index to v300 stable

on:
  push:
    paths:
      - '.github/workflows/bump-index-v300.yml'

permissions:
  contents: write

jobs:
  bump-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update index version markers only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          replacements = [
              ('<!-- INDEX_VERSION: 282 | גרסה 282 - טעינת cues מאולצת למסלולי הנשימה הסרעפתית -->',
               '<!-- INDEX_VERSION: 300 | גרסה 300 - גרסה יציבה -->'),
              ('<!-- LIVE_SITE: https://avivnof.github.io/regulaion/?v=282 -->',
               '<!-- LIVE_SITE: https://avivnof.github.io/regulaion/?v=300 -->'),
              ('<meta name="app-version" content="282" />',
               '<meta name="app-version" content="300" />'),
              ('assets/nof-logo.jpg?v=282', 'assets/nof-logo.jpg?v=300'),
              ('גרסה 282 | 28.06.2026', 'גרסה 300 | 28.06.2026'),
              ('audio/countdown-music.mp3?v=282', 'audio/countdown-music.mp3?v=300'),
              ("const APP_VERSION='282';", "const APP_VERSION='300';"),
              ('assets/tracks.json?v=282', 'assets/tracks.json?v=300'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected marker not found: {old}')
              s = s.replace(old, new)

          if '282' in s:
              raise SystemExit('Unexpected remaining version marker 282 in index.html')

          path.write_text(s, encoding='utf-8', newline='\n')

          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S | re.I)
          Path('/tmp/index-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          PY

          node --check /tmp/index-inline.js

      - name: Commit v300
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Mark relaxation site version 300 as stable"
          git push origin main
